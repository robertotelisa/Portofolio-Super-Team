<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Thomas wilbert Alfontra | Super Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #1b1b3a;
            --paper: #fff4d6;
            --sun: #ffd400;
            --accent: #2a4bff;
            --display: "Bangers", Impact, "Arial Black", sans-serif;
            --body: "Nunito", "Segoe UI", system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--body);
            font-weight: 600;
            color: var(--ink);
            background: var(--paper);
            line-height: 1.6;
        }

        a {
            color: inherit;
        }

        :focus-visible {
            outline: 4px solid var(--accent);
            outline-offset: 3px;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: .7rem clamp(1rem, 4vw, 3rem);
            background: var(--ink);
        }

        .nav .logo {
            font-family: var(--display);
            font-size: 1.5rem;
            letter-spacing: .06em;
            color: var(--sun);
        }

        .hero {
            background: var(--accent);
            border-bottom: 6px solid var(--ink);
            padding: clamp(2.5rem, 7vw, 5rem) clamp(1rem, 5vw, 4rem);
        }

        .hero-inner {
            max-width: 960px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: clamp(1.5rem, 4vw, 3rem);
            align-items: center;
        }

        .photo {
            display: grid;
            place-items: center;
            overflow: hidden;
            width: 260px;
            height: 260px;
            background: #fff;
            border: 5px solid var(--ink);
            font-size: 8rem;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .intro h1 {
            font-family: var(--display);
            font-weight: 400;
            font-size: clamp(3rem, 9vw, 5.5rem);
            line-height: .95;
            letter-spacing: .03em;
            color: var(--sun);
            -webkit-text-stroke: 2px var(--ink);
            paint-order: stroke fill;
            text-shadow: 5px 5px 0 var(--ink);
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 2.5rem 1rem 4rem;
            display: grid;
            gap: 2rem;
        }

        .panel {
            background: #fff;
            border: 4px solid var(--ink);
            padding: 1.2rem 1.4rem 1.4rem;
        }

        .panel h2 {
            font-family: var(--display);
            font-weight: 400;
            font-size: 1.8rem;
            letter-spacing: .04em;
            line-height: 1.1;
            margin-bottom: .6rem;
        }

        .skills h3 {
            font-weight: 800;
            font-size: 1rem;
            margin: .9rem 0 .4rem;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            list-style: none;
        }

        .chips li {
            font-weight: 800;
            padding: .15rem .8rem;
            border: 3px solid var(--ink);
            border-radius: 999px;
            background: var(--sun);
        }

        .activity {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 1.2rem;
            align-items: center;
        }

        .activity+.activity {
            margin-top: 1.4rem;
        }

        .activity img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            border: 4px solid var(--ink);
        }

        .activity h3 {
            font-weight: 800;
            font-size: 1.1rem;
        }

        .activity p {
            margin-top: .3rem;
        }

        @media (max-width: 680px) {
            .activity {
                grid-template-columns: 1fr;
            }
        }


        @media (max-width: 680px) {
            .hero-inner {
                grid-template-columns: 1fr;
                justify-items: center;
                text-align: center;
            }

            .photo {
                width: 210px;
                height: 210px;
                font-size: 6rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <header class="nav">
        <span class="logo">Anggota 2</span>
    </header>

    <section class="hero">
        <div class="hero-inner">

            <div class="photo">
                <img src="artifact/gambar1.jpg" alt="Foto Thomas Wilbert Alfontra">
            </div>

            <div class="intro">
                <h1>Thomas Wilbert Alfontra</h1>
            </div>
        </div>
    </section>

    <main>
        <section class="panel" id="hobi">
            <h2>Hobi</h2>
            <ul class="chips">
                <li>Belajar</li>
                <li>Membaca Buku</li>
            </ul>
        </section>

        <section class="panel skills" id="keahlian">
            <h2>Keahlian</h2>
            <h3>Bahasa pemrograman</h3>
            <!-- GANTI: tambah atau hapus <li> -->
            <ul class="chips">
                <li>Java</li>
                <li>JavaScript</li>
                <li>HTML &amp; CSS</li>
            </ul>
            <h3>Framework &amp; tools</h3>
            <ul class="chips">
                <li>Git</li>
            </ul>
        </section>


        <section class="panel" id="aktivitas">
            <h2>Aktivitas Terakhir</h2>
            <div class="activity">
                <img src="artifact/IMG-20261025-WA0030.jpg" alt="Deskripsi foto aktivitas">
                <div>
                    <h3>Reuni Kecil</h3>
                    <p>Melakukan reuni kecil bersama teman SMA </p>
                </div>
            </div>
        </section>

    </main>

</body>

</html>
